<ion-header>
  <ion-toolbar>
    <ion-title>Banking Assistant</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="chat-content">
  <div class="message-list">
    @for (message of messages(); track $index) {
      <div class="message" [class.message--user]="message.role === 'user'" [class.message--assistant]="message.role === 'assistant'">
        <div class="bubble-group">
          <div class="bubble" [class.bubble--escalated]="message.escalated">{{ message.content }}</div>
          @if (message.sources && message.sources.length > 0) {
            <div class="sources">
              <span class="sources__label">Sources</span>
              @for (source of message.sources; track source.title) {
                <span class="source-pill">{{ source.title }}</span>
              }
            </div>
          }
        </div>
      </div>
    }

    @if (showTypingIndicator()) {
      <div class="message message--assistant">
        <div class="bubble typing-indicator">
          <span></span><span></span><span></span>
        </div>
      </div>
    }
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <ion-item lines="none" class="composer">
      <ion-input
        placeholder="Ask about accounts, fees, loans..."
        [value]="draft()"
        (ionInput)="onDraftChange($event.detail.value)"
        (keyup.enter)="send()"
        [disabled]="isStreaming()"
      ></ion-input>
      <ion-button slot="end" (click)="send()" [disabled]="isStreaming() || !draft().trim()">Send</ion-button>
    </ion-item>
  </ion-toolbar>
</ion-footer>
