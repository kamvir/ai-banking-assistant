services:
  - type: web
    name: ai-banking-assistant-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build --workspace=api
    startCommand: npm run start:prod --workspace=api
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: PORT
        value: 3000
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: RAG_CONFIDENCE_THRESHOLD
        value: 0.75
