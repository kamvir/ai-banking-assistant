name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19'
          cache: npm

      - run: npm ci

      - run: npm run lint --workspace=api
      - run: npm run lint --workspace=mobile-web

      - run: npm run build --workspace=api
      - run: npm run build --workspace=mobile-web
